<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelX — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .auth-card{ width: 380px; }
  .auth-header{ text-align:center; margin-bottom: 26px; }
  .auth-header .brand{ justify-content:center; margin-bottom: 6px; font-size: 22px; }
  .auth-header p{ color: var(--text-muted); font-size: 13px; margin:0; font-family: var(--font-mono); }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input{ width:100%; }
  .auth-actions{ margin-top: 18px; display:flex; flex-direction:column; gap:10px; }
  .toggle-link{ text-align:center; font-size: 13px; color: var(--text-muted); margin-top: 16px; }
  .scanline{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="auth-wrap">
  <div class="panel auth-card" style="position:relative; z-index:1;">
    <div class="auth-header">
      <div class="brand"><span class="dot"></span> SentinelX</div>
      <p><span class="mono">// AI-powered vulnerability intelligence</span></p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text" placeholder="analyst1" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="auth-actions">
        <button type="submit" class="primary" id="loginBtn">Sign in</button>
      </div>
      <div id="loginError" class="error-msg hidden"></div>
    </form>

    <form id="registerForm" class="hidden">
      <div class="field">
        <label for="regUsername">Username</label>
        <input id="regUsername" type="text" placeholder="analyst1" required>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" placeholder="At least 8 characters" required minlength="8">
      </div>
      <div class="auth-actions">
        <button type="submit" class="primary" id="regBtn">Create account</button>
      </div>
      <div id="regError" class="error-msg hidden"></div>
      <div id="regSuccess" class="success-msg hidden"></div>
    </form>

    <div class="toggle-link">
      <span id="showRegister">New here? <a href="#">Create an account</a></span>
      <span id="showLogin" class="hidden">Already have an account? <a href="#">Sign in</a></span>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const showRegister = document.getElementById("showRegister");
  const showLogin = document.getElementById("showLogin");

  showRegister.addEventListener("click", (e) => {
    e.preventDefault();
    loginForm.classList.add("hidden");
    registerForm.classList.remove("hidden");
    showRegister.classList.add("hidden");
    showLogin.classList.remove("hidden");
  });
  showLogin.addEventListener("click", (e) => {
    e.preventDefault();
    registerForm.classList.add("hidden");
    loginForm.classList.remove("hidden");
    showLogin.classList.add("hidden");
    showRegister.classList.remove("hidden");
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("loginError");
    errEl.classList.add("hidden");
    const btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const { access_token } = await SentinelAPI.login(
        document.getElementById("loginUsername").value.trim(),
        document.getElementById("loginPassword").value
      );
      Auth.setToken(access_token);
      window.location.href = "dashboard.html";
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove("hidden");
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("regError");
    const okEl = document.getElementById("regSuccess");
    errEl.classList.add("hidden"); okEl.classList.add("hidden");
    const btn = document.getElementById("regBtn");
    btn.disabled = true; btn.textContent = "Creating…";
    try {
      await SentinelAPI.register(
        document.getElementById("regUsername").value.trim(),
        document.getElementById("regEmail").value.trim(),
        document.getElementById("regPassword").value
      );
      okEl.textContent = "Account created. You can sign in now.";
      okEl.classList.remove("hidden");
      registerForm.reset();
      setTimeout(() => showLogin.click(), 900);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove("hidden");
    } finally {
      btn.disabled = false; btn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
